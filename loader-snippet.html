<!DOCTYPE html>
<html lang="en">
<!-- 1. PASTE THIS INTO YOUR <HEAD> -->
<link rel="stylesheet" href="loader.css">

<body>
    <!-- 2. PASTE THIS AT THE VERY TOP OF <BODY> -->
    <div id="aorr-loader">
        <div class="loader-content">
            <!-- Center Brand Logo -->
            <div class="loader-logo-wrapper">
                <picture>
                    <source srcset="images/logo.webp" type="image/webp">
                    <img src="images/logo.png" alt="AORR Global Enterprise Logo" class="loader-logo-img">
                </picture>
            </div>
            
            <!-- Orbit Rings -->
            <div class="loader-ring-1"></div>
            <div class="loader-ring-2"></div>
            
            <!-- Text & Progress -->
            <div class="loader-text-container">
                <span class="loader-brand">AORR</span>
                <span class="loader-tagline">Global Enterprise</span>
                
                <div class="loader-progress-track">
                    <div class="loader-progress-bar"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. PASTE THIS AT THE BOTTOM OF <BODY> (Before closing </body>) -->
    <script src="loader.js"></script>
    
    <!-- YOUR WEBSITE CONTENT GOES HERE -->
</body>
</html>
